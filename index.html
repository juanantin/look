<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>You Look You Buy</title>
<meta name="description" content="You Look You Buy — on Robinhood Chain">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="assets/favicon-512.png" type="image/png" sizes="512x512">
<style>
  :root {
    --green: #00c805;
    --bg: #05070a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
  }
  .overlay {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.5vh, 14px);
    padding: 20px;
    padding-bottom: clamp(20px, 4vh, 40px);
    text-align: center;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    width: 100%;
  }
  h1 {
    margin: 0;
    color: #fff;
    font-size: clamp(18px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 24px rgba(0,0,0,0.6);
  }
  h1 span {
    color: var(--green);
  }
  .tag {
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #d7ffd9;
    font-size: clamp(10px, 1.3vw, 13px);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
    opacity: 0.9;
  }
  .tag img {
    width: 1.3em;
    height: 1.3em;
    border-radius: 25%;
  }
  .tag:hover {
    text-decoration: underline;
  }
  .tag span {
    color: var(--green);
    font-weight: 800;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 1.5vw, 14px);
    margin-top: clamp(4px, 1vh, 10px);
  }
  .btn {
    appearance: none;
    border: 2px solid var(--green);
    background: rgba(0, 200, 5, 0.12);
    color: #fff;
    font-size: clamp(12px, 1.3vw, 14px);
    font-weight: 700;
    padding: 0.7em 1.3em;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(6px);
    transition: background 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--green);
    color: #05070a;
    transform: translateY(-1px);
  }
  .ca {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 46vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast {
    position: fixed;
    bottom: clamp(16px, 4vh, 32px);
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--green);
    color: #05070a;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 3;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <div class="stage">
    <video autoplay muted loop playsinline>
      <source src="assets/hero.webm" type="video/webm">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="overlay">
      <a class="tag" href="https://eyes.family" target="_blank" rel="noopener">
        <img src="assets/eyes-logo.png" alt="">
        Fair launch on <span>eyes.family</span>
      </a>
      <h1>You Look, You <span>Buy</span></h1>
      <div class="links">
        <a class="btn" href="https://dexscreener.com/robinhood-chain/PASTE_PAIR_ADDRESS_HERE" target="_blank" rel="noopener">Chart</a>
        <a class="btn" href="https://x.com/youlookyouape" target="_blank" rel="noopener">X</a>
        <button class="btn ca" id="caBtn" type="button" data-ca="TBA">CA: TBA</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Copied!</div>
  <script>
    const caBtn = document.getElementById('caBtn');
    const toast = document.getElementById('toast');
    caBtn.addEventListener('click', async () => {
      const ca = caBtn.dataset.ca;
      try {
        await navigator.clipboard.writeText(ca);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = ca;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    });
  </script>
</body>
</html>
